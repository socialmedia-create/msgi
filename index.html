<style>
/* Only styles required for the 3-slide hero marquee. Existing site styles remain untouched. */
.msec-hero-marquee {
  position: relative;
  overflow: hidden;
}

.msec-hero-slide {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  visibility: hidden;
  transition: opacity .45s ease-in-out, visibility .45s ease-in-out;
}

.msec-hero-slide.active {
  position: relative;
  opacity: 1;
  visibility: visible;
  z-index: 2;
}

.msec-hero-image-slide {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff;
}

.msec-hero-image-slide img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
}

.msec-video-only-stats {
  transition: opacity .25s ease;
}

@media (max-width: 991px) {
  .msec-hero-image-slide img {
    object-fit: contain;
  }
}
</style>

<script>
(function () {
  const marquee = document.getElementById('msecHeroMarquee');
  if (!marquee) return;

  const slides = Array.from(marquee.querySelectorAll('.msec-hero-slide'));
  const video = document.getElementById('msecHeroVideo');
  const interval = 5000; // exactly 5 seconds per slide
  let current = 0;
  let timer;

  function showSlide(index) {
    current = index;
    slides.forEach((slide, i) => slide.classList.toggle('active', i === current));

    // The Why Choose Us card exists only inside slide 1, so it is automatically
    // hidden whenever either promotional banner is active.
    if (video) {
      if (current === 0) {
        video.currentTime = 0;
        video.play().catch(() => {});
      } else {
        video.pause();
      }
    }
  }

  function startMarquee() {
    clearInterval(timer);
    timer = setInterval(() => {
      showSlide((current + 1) % slides.length);
    }, interval);
  }

  showSlide(0); // first: existing video
  startMarquee();
})();
</script>
